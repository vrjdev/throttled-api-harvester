[project]
name = "throttled-api-harvester"
version = "0.1.0"
description = "Rate-limited, resumable API fetcher that stores results in S3"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["requests>=2.31", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
getter = "getter.worker:main"

[tool.setuptools]
packages = ["getter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
